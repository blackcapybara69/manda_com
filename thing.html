<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sam & Max Tracker</title>
<style>
  body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background-image: url("https://samandmax.co.uk/media/original_images/max_1920x1200.jpg");
        color: #ffffff;
        text-align: center;
        min-height: 100%;
        background-size: cover;
        background-attachment: fixed;
    }

    h1 {
        margin: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .episode {
        cursor: pointer;
        transition: 0.3s;
    }

    .episode img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
        border: 3px solid transparent;
    }

    .completed img {
        filter: grayscale(100%) brightness(0.5);
        border: 3px solid lime;
    }
</style>
</head>
<body>

<h1>Sam & Max Tracker</h1>

<div class="grid" id="grid"></div>

<script>
// 6 episodes
const count = 6;

// fixed your comma, added 6 unique images
const images = [
    "https://samandmax.co.uk/media/original_images/31.png",
    "https://samandmax.co.uk/media/original_images/8.png",
    "https://samandmax.co.uk/media/original_images/68.png",
    "https://samandmax.co.uk/media/original_images/20.png",
    "https://samandmax.co.uk/media/original_images/18.png",
    "https://samandmax.co.uk/media/original_images/35.png"
];

// shuffle function
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

const grid = document.getElementById("grid");
let completed = JSON.parse(localStorage.getItem("sammax_progress")) || {};

// shuffle images so each episode is unique
const shuffledImages = shuffle(images.slice());

for (let i = 1; i <= count; i++) {
    const div = document.createElement("div");
    div.classList.add("episode");

    if (completed[i]) div.classList.add("completed");

    div.innerHTML = `
        <img src="${shuffledImages[i-1]}">
        <p>Episode ${i}</p>
    `;

    div.onclick = () => {
        completed[i] = !completed[i];
        localStorage.setItem("sammax_progress", JSON.stringify(completed));
        div.classList.toggle("completed");
    };

    grid.appendChild(div);
}
</script>

</body>
</html>
